# Deploy the Twilight app (not Orbit leftovers or editor files) to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage public Twilight site
        run: |
          mkdir -p public-site
          cp index.html twilight.js twilight-panic.js orbit.html 404.html manifest.json README.md public-site/
          touch public-site/.nojekyll
          if [ -d helios ]; then cp -R helios public-site/helios; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
